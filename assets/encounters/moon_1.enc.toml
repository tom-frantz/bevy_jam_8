name = "Mushroom Forest"


# arrival
[[context_items]]
name = "arrival"
text = "As you rise upward above even the highest clouds, the boundless blue of sky retreats into myriad pinprick constellations against an inky canvas, the gentle breeze replaced by a silent and serene calm. At the very tip of the moon's pointed crescent you spot a small cottage with windows lit by warm orange and a chimney lazily billowing a thin trail of smoke balancing precariously."

# arrival choice 1
[[context_items.choices]]
text = "Get a better look of the surroundings"
goto_context = "house1"

[[context_items]]
name = "arrival2"
text = "One the moon's tip the cottage remains as perfectly balanced as ever. Further inward a large portion of the lunar surface is dominated by a field of red, orange and yellow. By the harsh clifflike edges you can see strange shimmering clouds."

# arrival2 choice 1
[[context_items.choices]]
text = "Drift towards the front door of the cottage"
goto_context = "house1"

# arrival choice 2
[[context_items.choices]]
text = "Approach the fields"
goto_context = "ignis"

# arrival choice 3
[[context_items.choices]]
text = "Fly by the clouds"
goto_context = "cloud"

# arrival choice 3
[[context_items.choices]]
text = "Leave"
goto_context = "map"

# house1
[[context_items]]
name = "house1"
text = "The cottage appears totally normal, somehow making it stand out even more against the ethereal surrounds. While it's construction appears rather old, upon closer inspection it has clearly been maintained."

# house1 choice 1
[[context_items.choices]]
text = "Give the door a polite knock"
goto_context = "house2"

# house2
[[context_items]]
name = "house2"
text = "Your rhythmic taps echo happily across the frame, and as the sounds fade prepare yourself for whatever sort of person would choose to live in such seclusion."

# house2 choice 1
[[context_items.choices]]
text = "Wait for someone to answer the door"
goto_context = "housewait1"

# housewait1
[[context_items]]
name = "housewait1"
text = "You wait patiently, tapping your foot slowly..."

# housewait1 choice 1
[[context_items.choices]]
text = "Continue waiting"
goto_context = "housewait2"

# housewait2
[[context_items]]
name = "housewait2"
text = "As the moments stretch by you find yourself focusing your hearing for any signs of a response from the occupant, anticipating a footfall or shuffle of some sort."

# housewait2 choice 1
[[context_items.choices]]
text = "Continue waiting..."
goto_context = "house3"

# house3
[[context_items]]
name = "house3"
text = "You're about to give up on anyone answering when the door begins to shift ever so slowly, hinges squeaking. Almost painfully slowly, the door opens inward, bathing you in the orange glow from inside to reveal... Nothing. You stare blankly for a moment at the cottage's interior before a faint tapping draws your eyes to the floor in front of you, where a somewhat impatient crab is rapping one of its pincers against the door. As you make eye contact it stops its tapping and instead gestures behind it. An invitation inside. Probably."

# house3 choice 1
[[context_items.choices]]
text = "Follow the crab inside"
goto_context = "crab_questgive1"

# crab_questgive1
[[context_items]]
name = "crab_questgive1"
text = "You stand inside the cottage facing the crab. It rests upon a low coffee table that bears a fancy looking globe and a pile of torn papers. Now that you get a better look at it the crab appears restless, its many legs tapping the tabletop in place while it clicks its pincers impatiently, occasionally picking a scrap of paper from the mound to shred further. Knowing it has your attention, the crab begins gesturing feverishly between the shredded papers and the globe, rapidly tapping its pincer the blue expanses a few times whenever it swings to the latter."

# crab_questgive1 choice 1
[[context_items.choices]]
text = "Examine the pile of paper scraps"
goto_context = "crab_questgive2"

# crab_questgive2
[[context_items]]
name = "crab_questgive2"
text = "Peering over at the papers in order to understand what the crab is trying to communicate, it doesn't take long to piece together that it's some sort of painting depicting the moon itself. Moon then globe. Moon then globe..."

# crab_questgive2 choice 1
[[context_items.choices]]
text = "'You want... to leave the moon and go to the ocean?'"
goto_context = "crab_questgive3"

# crab_questgive3
[[context_items]]
name = "crab_questgive3"
text = "The crab hops from one side to the other, snapping its pincers in the air happily. That's probably a yes. <m>'I have a broom! I could give you a ride down if you want'<m> you offer. Rather than answer directly, the crab instead gestures across the room to the kitchen counter, the joy from its previous success at communication all but faded away. "

# crab_questgive3 choice 1
[[context_items.choices]]
text = "Check out whats on the counter"
goto_context = "crab_contract"
[[context_items.choices.execute]]
MarkQuest = "Started"

# crab_contract
[[context_items]]
name = "crab_contract"
text = "Sitting neatly on the counter is a small sheet of parchment. A contract to serve as the live-in caretaker for the lunar cottage is penned neatly in a shimmering script. A line at the bottom bears the squiggly signature of that reads 'Ferris'. Interestingly, the section that should detail the method for the contract's termination leaves an odd blank line and a half in the middle of the document. Running your hand along the page you clearly feel the magic from alchemical ink even in the missing portion. There must be something written there that you can't see!"

# crab_contract choice 1
[[context_items.choices]]
text = "Peer through the Magic Lens"
goto_context = "moon_questcomplete"
[context_items.choices.requires]
alt_text= "(I need some way to read the invisible ink...)"
req_items= ["MagicLens"]
[[context_items.choices.execute]]
MarkQuest="Complete"

# crab_contract choice 1
[[context_items.choices]]
text = "I could just burn the contract, what's the worst that could happen?"
goto_context = "moon_questskip"
[[context_items.choices.execute]]
AddItem="LastBreathOfInnocent"
[[context_items.choices.execute]]
MarkQuest="Complete"

# crab_contract choice 2
[[context_items.choices]]
text = "Leave"
Leave = {}

# 
[[context_items]]
name = "ignis"
text = "You arrive at the brilliant field to find that it is comprised entirely of a small type of flower that has a tiny torch of light where its petals would be"
[[context_items.choices]]
text = "Take some of the flowers"
goto_context = "arrival2"
[[context_items.choices.execute]]
AddItem="IgnisAster"

# crab_contract choice 2
[[context_items.choices]]
text = "Back"
goto_context="arrival2"

[[context_items]]
name = "ignis"
text = "Fly to the edge of the moon. The small clouds look solid enough to grab and weirdly... tasty?."

[[context_items.choices]]
text = "Grab some clouds"
goto_context = "arrival2"
[[context_items.choices.execute]]
AddItem="CloudCandy"

# crab_contract choice 2
[[context_items.choices]]
text = "Back"
goto_context="arrival2"


# moon_questcomplete
[[context_items]]
name = "moon_questcomplete"
text = "You put the Magic Lens up to your eye and look back at the contract on the counter. Clear as day you can now make out the instructions for setting Ferris free! <m>'Spin once counter-clockwise, three times clockwise, damage some property and then let out a deep breath while you think about home'<m> you turn to face the crab after reading out the instructions just as it manages to flip the coffee table over with enough force to smash the globe that rested there. As Ferris exhales a shimmering wisp of energy is formed in the air in front of it. Uninterested, Ferris gives you a small nod before rapidly scuttling across the room and out the door. It immediately bee-lines and hops right off the moon! You're sure it'll make it back home."
[[context_items.choices]]
text = "Gather the wisp of energy"
[[context_items.choices.execute]]
Leave = {}

# moon_questcomplete
[[context_items]]
name = "moon_questskip"
text= "You pick up the contract and toss it into the fireplace beside you. Glancing over, you see Ferris is slumped on the coffee table, unmoving. As you rush to its side a final rattling exhale is released, spewing forth a dark billowing cloud across the tabletop. It continues to expand for a few moments, before condensing into a single point and forming a macabre stoppered bottle around itself. The bottle clatters onto the table, bringing attention to the absolute silence that now surrounds you."

[[context_items.choices]]
text = "Take the bottle and leave"
[[context_items.choices.execute]]
Leave = {}
